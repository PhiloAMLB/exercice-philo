<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Minimaliste</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 100px auto;
            padding: 0 20px;
            background-color: #fff;
        }
        h1 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        a {
            color: #0070f3;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 100px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Bienvenue sur mon site.</h1>
    <p>Ceci est un exemple de site extrêmement simple, hébergé sur GitHub Pages.</p>
    <p>Vous pouvez modifier ce texte pour décrire votre projet, votre portfolio ou vos pensées.</p>
    
    <footer>
        <p>© 2026 - Créé avec simplicité.</p>
    </footer>
</body>
</html>
